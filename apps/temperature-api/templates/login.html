<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход в систему Умный дом</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { display:flex; align-items:center; justify-content:center; height:100vh; background-color:#f8f9fa; }
        .login-container { width:400px; padding:20px; background:#fff; border-radius:5px; box-shadow:0 0 10px rgba(0,0,0,.1); }
    </style>
</head>
<body>
<div class="login-container">
    <h2 class="text-center mb-4">Авторизация</h2>
    <form id="loginForm">
        <div class="mb-3">
            <label for="username" class="form-label">Имя пользователя</label>
            <input type="text" placeholder="Введите user1" class="form-control" id="username" name="username" required>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Пароль</label>
            <input type="password" placeholder="Введите user1" class="form-control" id="password" name="password" required>
        </div>
        <div class="d-grid">
            <button type="submit" class="btn btn-primary">Войти</button>
        </div>
        <div id="error-message" class="mt-3 text-danger text-center" style="display:none;"></div>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', function(event) {
    event.preventDefault();
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const errorMessage = document.getElementById('error-message');

    if (username === '' || password === '') {
        errorMessage.textContent = 'Пожалуйста, заполните все поля.';
        errorMessage.style.display = 'block';
        return;
    }
    fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: username, password: password })
    })
    .then(response => {
        if (response.ok) {
            window.location.href = '/index';
        } else {
            errorMessage.textContent = 'Неверное имя пользователя или пароль.';
            errorMessage.style.display = 'block';
        }
    })
    .catch(error => {
        console.error('Ошибка:', error);
        errorMessage.textContent = 'Произошла ошибка. Попробуйте еще раз.';
        errorMessage.style.display = 'block';
    });
});
</script>
</body>
</html>
